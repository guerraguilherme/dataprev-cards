<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#155eef">
<title>Configurar DATAPREV Sessões</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#162033;--muted:#68758d;--line:#d7deea;--accent:#155eef;--ok:#087443;--okbg:#e9f8f0;--bad:#b42318;--badbg:#fff0ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:620px;margin:0 auto;padding:18px 12px calc(60px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 12px rgba(18,38,63,.06)}h1{font-size:1.5rem;margin:0 0 10px}.small{color:var(--muted);line-height:1.5}button,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px}button{font-weight:800;background:#fff;color:var(--text)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}textarea{min-height:150px;resize:vertical}.status{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);line-height:1.45}.status.ok{background:var(--okbg);color:#075c34;border-color:#9bd7b8}.status.bad{background:var(--badbg);color:#8e1b12;border-color:#f0a8a1}.hidden{display:none}a{color:var(--accent);font-weight:750;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>Conectar DATAPREV Sessões</h1>
    <p class="small">No DATAPREV Cards, toque em <b>Copiar configuração para Sessões</b>. Depois volte a esta página e importe. A chave fica somente neste navegador.</p>
    <button id="importBtn" class="primary">Importar configuração copiada</button>
    <button id="manualBtn">Colar manualmente</button>
    <div id="manualBox" class="hidden">
      <textarea id="manualText" placeholder='Cole aqui o texto copiado pelo DATAPREV Cards'></textarea>
      <button id="saveManualBtn">Salvar texto colado</button>
    </div>
    <div id="status" class="status">Aguardando importação.</div>
    <p class="small" style="margin-top:16px"><a href="./">Voltar às Sessões</a></p>
  </div>
</div>
<script>
const SESSIONS_KEY="dataprev_sessoes_sync_config_v1";
const CARDS_KEY="dataprev_cards_sync_config_v1";
function status(message,type=""){
  const box=document.getElementById("status");
  box.textContent=message;
  box.className="status"+(type?" "+type:"");
}
function normalizeEndpoint(value){
  const url=new URL(String(value||"").trim());
  if(url.protocol!=="https:"||!url.pathname.endsWith("/exec"))throw new Error("URL inválida: use o endereço HTTPS terminado em /exec.");
  url.search="";url.hash="";return url.toString();
}
function savePayload(text){
  const parsed=JSON.parse(String(text||"").trim());
  if(parsed?.type!=="dataprev-sync-config")throw new Error("O conteúdo não é a configuração gerada pelo DATAPREV Cards.");
  const config={endpoint:normalizeEndpoint(parsed.endpoint),token:String(parsed.token||"").trim(),deviceId:String(parsed.deviceId||"").trim()};
  if(!config.token||!config.deviceId)throw new Error("A configuração está incompleta.");
  localStorage.setItem(SESSIONS_KEY,JSON.stringify(config));
  localStorage.setItem(CARDS_KEY,JSON.stringify(config));
  status("Configuração salva. Voltando às Sessões…","ok");
  try{navigator.clipboard.writeText("DATAPREV Sessões configurado");}catch{}
  setTimeout(()=>location.replace("./?configured=1&v=023"),900);
}
document.getElementById("importBtn").onclick=async()=>{
  try{savePayload(await navigator.clipboard.readText());}
  catch(error){status("Falha ao ler automaticamente: "+error.message+" Use “Colar manualmente” abaixo.","bad");document.getElementById("manualBox").classList.remove("hidden");}
};
document.getElementById("manualBtn").onclick=()=>document.getElementById("manualBox").classList.toggle("hidden");
document.getElementById("saveManualBtn").onclick=()=>{try{savePayload(document.getElementById("manualText").value);}catch(error){status("Falha: "+error.message,"bad");}};
</script>
</body>
</html>
