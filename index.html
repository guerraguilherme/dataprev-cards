<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#155eef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DATAPREV Cards">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<title>DATAPREV Cards — MVP 04 · Lote 02</title>
<style>
:root {
  --bg:#f4f6f8; --card:#ffffff; --text:#17202a; --muted:#667085;
  --line:#d8dee6; --accent:#155eef; --accent2:#e8f0ff;
  --ok:#0f7b45; --okbg:#e9f8f0; --bad:#b42318; --badbg:#fff0ee;
  --warn:#8a5b00; --warnbg:#fff7df;
}
*{box-sizing:border-box}
html{scroll-padding-bottom:210px}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overscroll-behavior-y:contain;
}
.app{
  max-width:720px; margin:0 auto;
  padding:14px 14px calc(200px + env(safe-area-inset-bottom) + var(--viewport-cover, 0px));
}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.brand{font-weight:800;font-size:1.05rem}
.small{font-size:.84rem;color:var(--muted)}
.panel,.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;box-shadow:0 2px 8px rgba(16,24,40,.04)
}
.panel{margin-bottom:12px}
.progress{height:10px;background:#e8ecf1;border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit}
button{
  border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:10px 13px;color:var(--text);font-weight:650;touch-action:manipulation
}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:var(--accent2);border-color:#bdd0ff;color:#123b8f}
button.danger{background:#fff;border-color:#f3b7b2;color:var(--bad)}
button:disabled{opacity:.48}
select,input,textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;
  padding:10px;background:#fff;color:var(--text)
}
textarea{min-height:82px;resize:vertical}
.hidden{display:none!important}
.kicker{font-size:.76rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
h1{font-size:1.45rem;margin:6px 0 10px}
h2{font-size:1.1rem;margin:14px 0 8px}
.info{padding:11px 12px;border-radius:12px;margin:8px 0;line-height:1.45}
.info.ex{background:#f3f6fa}
.info.tip{background:var(--warnbg);color:#4a3300}
.question{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.alt{display:block;width:100%;text-align:left;margin:7px 0;background:#fff}
.alt.selected{border-color:var(--accent);background:var(--accent2)}
.alt.correct{border-color:#75c99c;background:var(--okbg)}
.alt.wrong{border-color:#f0a8a1;background:var(--badbg)}
.feedback{padding:11px 12px;border-radius:12px;margin-top:10px;line-height:1.4}
.feedback.ok{background:var(--okbg);color:#075c34}
.feedback.bad{background:var(--badbg);color:#8e1b12}
.badge{
  display:inline-flex;align-items:center;padding:5px 8px;border:1px solid var(--line);
  border-radius:999px;font-size:.78rem;color:var(--muted)
}
.nav{display:flex;gap:8px;margin-top:16px;scroll-margin-bottom:200px}
.nav button{flex:1;min-height:48px}
.note-panel{
  margin-top:14px;border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;background:#f8fafc
}
.note-panel summary{font-weight:750;color:var(--text)}
.note-panel textarea{margin-top:10px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.05rem}
.confidenceBox{margin-top:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fafbfc}
.confidenceBox .row button{flex:1}
.pending{background:var(--warnbg);color:#5d4200;padding:9px 11px;border-radius:10px;margin-top:10px}
details summary{cursor:pointer;font-weight:700}
@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .app{padding:10px 10px calc(200px + env(safe-area-inset-bottom) + var(--viewport-cover, 0px))}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="brand">DATAPREV Cards</div>
      <div class="small">MVP 04 · 30 cards · Lotes 01 e 02 · PWA 1.1</div>
    </div>
    <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
      <span class="badge" style="color:#0f7b45;border-color:#9bd7b8;background:#e9f8f0">Offline pronto</span>
      <span class="badge" id="modeBadge">Trilha</span>
    </div>
  </div>

  <div class="panel">
    <div class="small" id="progressText">0 de 10 cards concluídos</div>
    <div class="progress" style="margin-top:7px"><div id="progressBar"></div></div>
    <div class="stats">
      <div class="stat"><b id="doneStat">0</b><span class="small">cards</span></div>
      <div class="stat"><b id="answeredStat">0</b><span class="small">questões</span></div>
      <div class="stat"><b id="accStat">—</b><span class="small">acertos</span></div>
      <div class="stat"><b id="timeStat">00:00</b><span class="small">tempo ativo</span></div>
    </div>
  </div>

  <details class="panel">
    <summary>Controles da sessão</summary>
    <div style="margin-top:12px">
      <label class="small">Modo</label>
      <select id="mode">
        <option value="trilha">Trilha ordenada</option>
        <option value="revisao">Revisão inteligente</option>
        <option value="rapida">Sessão rápida</option>
        <option value="resgate">Modo resgate</option>
      </select>
      <div class="row" style="margin-top:10px">
        <button id="timerBtn">Pausar tempo</button>
        <button id="exportBtn">Exportar checkpoint</button>
        <button id="importBtn">Importar checkpoint</button>
        <button id="reportBtn">Gerar relatório</button>
        <button id="resetBtn" class="danger">Reiniciar</button>
      </div>
      <input id="fileInput" type="file" accept=".json" class="hidden">
    </div>
  </details>

  <section class="card" id="studyCard">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="info ex" id="explanation"></div>
    <div class="info ex" id="example"></div>
    <div class="info tip" id="trap"></div>

    <div id="questionArea"></div>

    <div class="nav" id="cardNav">
      <button id="prevBtn">Card anterior</button>
      <button id="nextBtn" class="primary">Próximo card</button>
    </div>

    <details class="note-panel" id="noteDetails">
      <summary>Adicionar nota rápida (opcional)</summary>
      <textarea id="note" placeholder="Anote dúvida, regra ou pegadinha..."></textarea>
    </details>
  </section>

  <section class="panel hidden" id="reportPanel">
    <h2 style="margin-top:0">Relatório da sessão</h2>
    <textarea id="reportText" style="min-height:360px"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="copyReport" class="primary">Copiar relatório</button>
      <button id="closeReport">Fechar</button>
    </div>
  </section>
</div>

<script>
const CARDS = [{"id": "EST-PROB-001", "disciplina": "Estatística", "topico": "Probabilidade", "titulo": "Evento complementar", "explicacao": "O complementar de um evento A reúne todos os resultados em que A não ocorre. Sua probabilidade é 1 − P(A).", "exemplo": "Se P(A)=0,30, então P(Aᶜ)=0,70.", "pegadinha": "A FGV pode trocar “não ocorrer A” por “ocorrer qualquer resultado fora de A”.", "questoes": [{"enunciado": "Se P(A)=0,42, então P(Aᶜ) é:", "alternativas": ["0,42", "0,48", "0,58", "1,42", "0,68"], "gabarito": 2, "comentario": "Como P(Aᶜ)=1−P(A), temos 1−0,42=0,58."}, {"enunciado": "A expressão “pelo menos um” é frequentemente resolvida por:", "alternativas": ["somar probabilidades sem verificar interseção", "usar o evento complementar de nenhum", "multiplicar sempre as probabilidades", "subtrair a maior da menor", "usar apenas média aritmética"], "gabarito": 1, "comentario": "“Pelo menos um” costuma ser calculado por 1−P(nenhum)."}], "lote": 1}, {"id": "EST-PROB-002", "disciplina": "Estatística", "topico": "Probabilidade condicional", "titulo": "Leitura de P(A|B)", "explicacao": "P(A|B) significa a probabilidade de A ocorrer sabendo que B ocorreu. O evento após a barra é a condição.", "exemplo": "P(defeito|máquina 2) observa apenas as peças produzidas pela máquina 2.", "pegadinha": "P(A|B) e P(B|A) geralmente são diferentes.", "questoes": [{"enunciado": "P(M2|D) representa:", "alternativas": ["probabilidade de defeito sabendo que veio da M2", "probabilidade de vir da M2 sabendo que houve defeito", "probabilidade conjunta de M2 e D", "probabilidade de não haver defeito na M2", "probabilidade marginal de M2"], "gabarito": 1, "comentario": "O que vem depois da barra é a condição: dado que houve defeito, qual a chance de ter vindo da M2?"}, {"enunciado": "Em P(D|M2), o universo de análise fica restrito a:", "alternativas": ["todas as peças", "apenas as defeituosas", "apenas as peças da M2", "apenas as peças da M1", "nenhuma das anteriores"], "gabarito": 2, "comentario": "A condição M2 restringe o universo às peças produzidas pela máquina 2."}], "lote": 1}, {"id": "BD-SQL-001", "disciplina": "Banco de Dados", "topico": "SQL", "titulo": "INNER JOIN", "explicacao": "O INNER JOIN retorna apenas as linhas que possuem correspondência entre as tabelas segundo a condição de junção.", "exemplo": "Clientes sem pedidos não aparecem em um INNER JOIN entre clientes e pedidos.", "pegadinha": "Uma linha pode aparecer várias vezes se houver várias correspondências na outra tabela.", "questoes": [{"enunciado": "Um cliente possui três pedidos. Em um INNER JOIN entre cliente e pedido, esse cliente tende a aparecer:", "alternativas": ["zero vezes", "uma vez", "duas vezes", "três vezes", "sempre quatro vezes"], "gabarito": 3, "comentario": "Cada correspondência gera uma linha no resultado; três pedidos geram três linhas."}, {"enunciado": "O INNER JOIN preserva automaticamente linhas sem correspondência?", "alternativas": ["sim, de ambas as tabelas", "sim, apenas da esquerda", "sim, apenas da direita", "não", "depende apenas do SELECT"], "gabarito": 3, "comentario": "Linhas sem correspondência são excluídas no INNER JOIN."}], "lote": 1}, {"id": "BD-SQL-002", "disciplina": "Banco de Dados", "topico": "SQL", "titulo": "LEFT JOIN", "explicacao": "O LEFT JOIN mantém todas as linhas da tabela da esquerda e associa dados da direita quando houver correspondência.", "exemplo": "Clientes sem pedidos continuam aparecendo, com NULL nas colunas de pedidos.", "pegadinha": "Filtrar no WHERE uma coluna da tabela direita pode eliminar os NULL e alterar o efeito esperado.", "questoes": [{"enunciado": "No LEFT JOIN, uma linha da tabela esquerda sem correspondência:", "alternativas": ["é descartada", "é mantida com NULL na direita", "é duplicada", "vira chave estrangeira", "gera erro"], "gabarito": 1, "comentario": "A tabela da esquerda é preservada; as colunas da direita ficam NULL."}, {"enunciado": "Para localizar clientes sem pedidos, uma estratégia comum é usar LEFT JOIN e filtrar:", "alternativas": ["cliente.id IS NULL", "pedido.id IS NULL", "pedido.id IS NOT NULL", "COUNT(*) > 1 sempre", "ORDER BY NULL"], "gabarito": 1, "comentario": "Se a coluna da tabela direita ficou NULL, não houve correspondência."}], "lote": 1}, {"id": "PY-BAS-001", "disciplina": "Python", "topico": "Tipos e operadores", "titulo": "Operador /", "explicacao": "Em Python 3, o operador / realiza divisão e retorna um valor do tipo float, mesmo quando o resultado é inteiro.", "exemplo": "6 / 3 resulta em 2.0.", "pegadinha": "Resultado numérico e tipo do resultado não são a mesma coisa.", "questoes": [{"enunciado": "Qual é o resultado e o tipo de 8 / 4?", "alternativas": ["2, int", "2.0, float", "2, float", "2.0, int", "erro"], "gabarito": 1, "comentario": "O valor é 2.0 e o tipo é float."}, {"enunciado": "A expressão 5 / 2 retorna:", "alternativas": ["2", "2.0", "2.5", "3", "erro"], "gabarito": 2, "comentario": "A divisão comum retorna 2.5."}], "lote": 1}, {"id": "PY-BAS-002", "disciplina": "Python", "topico": "Listas", "titulo": "Índices negativos", "explicacao": "Índices negativos acessam elementos a partir do final da lista. O índice -1 representa o último elemento.", "exemplo": "['Ana','Bruno','Caio'][-1] retorna 'Caio'.", "pegadinha": "O índice -0 é igual a 0, não ao último elemento.", "questoes": [{"enunciado": "Qual o resultado de ['A','B','C'][-2]?", "alternativas": ["A", "B", "C", "erro", "-2"], "gabarito": 1, "comentario": "-1 é C; -2 é B."}, {"enunciado": "Em Python, lista[-0] equivale a:", "alternativas": ["último elemento", "primeiro elemento", "penúltimo elemento", "erro", "lista vazia"], "gabarito": 1, "comentario": "-0 é o mesmo que 0, portanto acessa o primeiro elemento."}], "lote": 1}, {"id": "ML-CONC-001", "disciplina": "Ciência de Dados", "topico": "Fundamentos", "titulo": "Feature e target", "explicacao": "Features são variáveis de entrada usadas pelo modelo. Target é a variável que o modelo tenta prever.", "exemplo": "Para prever inadimplência, renda e idade podem ser features; inadimplente ou não é o target.", "pegadinha": "Uma mesma variável pode ser feature em um problema e target em outro.", "questoes": [{"enunciado": "Em um modelo que prevê preço de imóveis, o preço é geralmente:", "alternativas": ["feature", "target", "índice", "hiperparâmetro", "classe oculta"], "gabarito": 1, "comentario": "O preço é a variável a ser prevista, portanto o target."}, {"enunciado": "Features correspondem, em regra, a:", "alternativas": ["saídas esperadas", "variáveis de entrada", "erros do modelo", "métricas apenas", "rótulos obrigatoriamente textuais"], "gabarito": 1, "comentario": "Features são os atributos usados como entrada."}], "lote": 1}, {"id": "ML-CONC-002", "disciplina": "Ciência de Dados", "topico": "Aprendizado", "titulo": "Supervisionado x não supervisionado", "explicacao": "No aprendizado supervisionado há um alvo conhecido nos dados de treino. No não supervisionado, busca-se estrutura sem target rotulado.", "exemplo": "Classificação é supervisionada; agrupamento com K-Means é não supervisionado.", "pegadinha": "Não supervisionado não significa ausência de dados, mas ausência de alvo rotulado.", "questoes": [{"enunciado": "K-Means é normalmente classificado como aprendizado:", "alternativas": ["supervisionado", "não supervisionado", "por reforço", "semi-supervisionado obrigatoriamente", "determinístico puro"], "gabarito": 1, "comentario": "K-Means agrupa dados sem usar um target conhecido."}, {"enunciado": "Regressão linear para prever salário é, em regra:", "alternativas": ["não supervisionada", "supervisionada", "apenas descritiva", "algoritmo de clusterização", "regra de associação"], "gabarito": 1, "comentario": "Há um alvo numérico conhecido: o salário."}], "lote": 1}, {"id": "LEG-LAI-001", "disciplina": "Legislação", "topico": "LAI", "titulo": "Publicidade como regra", "explicacao": "Na LAI, a publicidade é o preceito geral e o sigilo é a exceção.", "exemplo": "A administração deve divulgar informações de interesse público mesmo sem solicitação, quando cabível.", "pegadinha": "A existência de informação pessoal ou sigilosa pode exigir restrição parcial, não necessariamente negar todo o documento.", "questoes": [{"enunciado": "Segundo a lógica da LAI, o sigilo é:", "alternativas": ["regra geral", "exceção", "faculdade ampla do gestor", "sempre definitivo", "aplicável a qualquer informação"], "gabarito": 1, "comentario": "A publicidade é a regra; o sigilo é excepcional."}, {"enunciado": "Quando parte de um documento é sigilosa, a solução pode ser:", "alternativas": ["negar tudo automaticamente", "conceder acesso à parte não sigilosa", "destruir o documento", "divulgar integralmente sempre", "encerrar o pedido sem resposta"], "gabarito": 1, "comentario": "A LAI admite acesso parcial com ocultação da parte protegida."}], "lote": 1}, {"id": "RL-PROP-001", "disciplina": "Raciocínio Lógico", "topico": "Proposições", "titulo": "Proposição lógica", "explicacao": "Proposição é uma frase declarativa à qual se pode atribuir valor verdadeiro ou falso.", "exemplo": "'Brasília é a capital do Brasil' é uma proposição.", "pegadinha": "Perguntas, ordens e exclamações normalmente não são proposições.", "questoes": [{"enunciado": "Qual das opções é uma proposição?", "alternativas": ["Feche a porta.", "Qual é seu nome?", "2 + 2 = 4.", "Tomara que chova!", "Estude mais."], "gabarito": 2, "comentario": "A frase é declarativa e possui valor lógico verdadeiro."}, {"enunciado": "A frase 'x + 2 = 5', sem valor definido para x, é:", "alternativas": ["proposição verdadeira", "proposição falsa", "sentença aberta", "ordem", "tautologia"], "gabarito": 2, "comentario": "Sem definir x, não é possível atribuir valor lógico determinado."}], "lote": 1}, {"id": "EST-PROB-003", "lote": 2, "disciplina": "Estatística", "topico": "Probabilidade", "titulo": "União e interseção", "explicacao": "A união A∪B reúne os resultados em que ocorre A, B ou ambos. A interseção A∩B reúne apenas os r ste de independência", "explicacao": "Dois eventos A e B são independentes quando a ocorrência de um não altera a probabilidade do outro. Uma forma de testar é verificar se P(A∩B)=P(A)P(B).", "exemplo": "Se P(A)=0,5, P(B)=0,4 e P(A∩B)=0,2, os eventos são independentes.", "pegadinha": "Não basta as probabilidades serem parecidas. É preciso verificar a relação matemática.", "questoes": [{"enunciado": "Se P(A)=0,6, P(B)=0,5 e P(A∩B)=0,3, então A e B são:", "alternativas": ["mutuamente exclusivos", "independentes", "complementares", "impossíveis", "necessariamente iguais"], "gabarito": 1, "comentario": "Como 0,6×0,5=0,3, vale P(A∩B)=P(A)P(B)."}, {"enunciado": "Se P(A)=0,4, P(B)=0,5 e P(A∩B)=0,1, os eventos são independentes?", "alternativas": ["sim, porque 0,4+0,5=0,9", "sim, porque a interseção é positiva", "não, porque 0,4×0,5=0,2", "não, porque eventos independentes não têm interseção", "não é possível responder"], "gabarito": 2, "comentario": "Para independência, a interseção deveria ser 0,4×0,5=0,2, e não 0,1."}, {"enunciado": "Quando A e B são independentes e P(B)>0, então:", "alternativas": ["P(A|B)=0", "P(A|B)=P(A)", "P(A|B)=P(B)", "P(A∩B)=0", "P(A∪B)=1"], "gabarito": 1, "comentario": "Se B não altera a chance de A, a probabilidade condicional permanece igual à marginal."}]}, {"id": "EST-PROB-006", "lote": 2, "disciplina": "Estatística", "topico": "Independência", "titulo": "Independência x exclusão mútua", "explicacao": "Eventos mutuamente exclusivos não podem ocorrer juntos. Eventos independentes podem ocorrer juntos, mas um não altera a chance do outro.", "exemplo": "Em um dado, sair 1 e sair 2 são exclusivos. Em dois lançamentos, o resultado do primeiro e do segundo podem ser independentes.", "pegadinha": "Eventos exclusivos com probabilidades positivas não são independentes, pois a ocorrência de um impede o outro.", "questoes": [{"enunciado": "Se A e B são mutuamente exclusivos, então:", "alternativas": ["P(A∩B)=0", "P(A∩B)=P(A)P(B) sempre", "P(A|B)=P(A) se   const ans=state.answers[card.id]||{};
  if(old){
    state.qConfidence[card.id]=state.qConfidence[card.id]||{};
    Object.keys(ans).forEach(qi=>{
      if(!state.qConfidence[card.id][qi]) state.qConfidence[card.id][qi]=old;
    });
  }
});

let currentQuestion=0;
let selected=null;
let saveCounter=0;

function save(){localStorage.setItem(KEY,JSON.stringify(state));}

function tickActiveTime(){
  const now=Date.now();
  if(state.timerRunning && !document.hidden){
    state.activeMs+=Math.max(0,now-state.lastTick);
  }
  state.lastTick=now;
  saveCounter++;
  if(saveCounter%10===0) save();
  updateTimeUI();
}

function formatDuration(ms){
  const total=Math.floor(ms/1000);
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;
  if(h>0) return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function updateTimeUI(){
  document.getElementById("timeStat").textContent=formatDuration(state.activeMs);
  document.getElementById("timerBtn").textContent=state.timerRunning?"Pausar tempo":"Retomar tempo";
}

document.addEventListener("visibilitychange",()=>{
  tickActiveTime();
  state.lastTick=Date.now();
  save();
});

setInterval(tickActiveTime,1000);

function getCardQuestionConfidence(cardId){
  return Object.values(state.qConfidence[cardId]||{});
}

function getSequence(){
  const all=CARDS.map((_,i)=>i);
  if(state.mode==="revisao"){
    const filtered=all.filter(i=>{
      const card=CARDS[i];
      const hasError=Object.values(state.answers[card.id]||{}).some(a=>a.correct===false);
      const weak=getCardQuestionConfidence(card.id).some(c=>c==="baixa"||c==="media");
      return state.marked[card.id]||hasError||weak;
    });
    return filtered.length?filtered:all;
  }
  if(state.mode==="resgate"){
    const filtered=all.filter(i=>{
      const card=CARDS[i];
      const hasError=Object.values(state.answers[card.id]||{}).some(a=>a.correct===false);
      const low=getCardQuestionConfidence(card.id).some(c=>c==="baixa");
      return hasError||low;
    });
    return filtered.length?filtered:all;
  }
  if(state.mode==="rapida") return all.slice(0,5);
  return all;
}

function currentCard(){
  const seq=getSequence();
  state.current=Math.max(0,Math.min(state.current,seq.length-1));
  return CARDS[seq[state.current]];
}

function answeredCount(card){
  return Object.keys(state.answers[card.id]||{}).length;
}

function firstUnanswered(card){
  for(let i=0;i<card.questoes.length;i++){
    if(!(state.answers[card.id]||{})[i]) return i;
  }
  return -1;
}

function isCardComplete(card){
  return answeredCount(card)===card.questoes.length;
}

function render(){
  const card=currentCard();
  document.getElementById("mode").value=state.mode;
  document.getElementById("modeBadge").textContent={
    trilha:"Trilha",revisao:"Revisão",rapida:"Sessão rápida",resgate:"Resgate"
  }[state.mode];
  document.getElementById("kicker").textContent=
    `${card.disciplina} · ${card.topico} · lote ${String(card.lote||1).padStart(2,"0")} · card ${state.current+1}/${getSequence().length}`;
  document.getElementById("title").textContent=card.titulo;
  document.getElementById("explanation").innerHTML="<b>Explicação:</b> "+card.explicacao;
  document.getElementById("example").innerHTML="<b>Exemplo:</b> "+card.exemplo;
  document.getElementById("trap").innerHTML="<b>Pegadinha FGV:</b> "+card.pegadinha;
  document.getElementById("note").value=state.notes[card.id]||"";
  document.getElementById("noteDetails").open=Boolean(state.notes[card.id]);
  renderQuestion();
  updateStats();
  updateTimeUI();
}

function renderQuestion(){
  const card=currentCard();
  currentQuestion=Math.max(0,Math.min(currentQuestion,card.questoes.length-1));
  const q=card.questoes[currentQuestion];
  const saved=(state.answers[card.id]||{})[currentQuestion];
  const draft=(state.drafts[card.id]||{})[currentQuestion];
  const confidence=(state.qConfidence[card.id]||{})[currentQuestion]||null;
  selected=saved?saved.selected:(Number.isInteger(draft)?draft:null);

  let html=`<div class="question">`;
  html+=`<div class="small">Questão ${currentQuestion+1} de ${card.questoes.length} · ${answeredCount(card)} respondida(s)</div>`;
  html+=`<h2>${q.enunciado}</h2>`;

  q.alternativas.forEach((a,i)=>{
    let cls="alt";
    if(selected===i) cls+=" selected";
    if(saved && i===q.gabarito) cls+=" correct";
    if(saved && i===saved.selected && !saved.correct) cls+=" wrong";
    html+=`<button class="${cls}" data-i="${i}" ${saved?"disabled":""}>${String.fromCharCode(65+i)}. ${a}</button>`;
  });

  html+=`<div class="confidenceBox">`;
  html+=`<div class="small"><b>Segurança antes da correção</b></div>`;
  html+=`<div class="row" style="margin-top:8px">`;
  ["baixa","media","alta"].forEach(c=>{
    const label={baixa:"Baixa",media:"Média",alta:"Alta"}[c];
    html+=`<button class="qConfidence ${confidence===c?"ghost":""}" data-c="${c}" ${saved?"disabled":""}>${label}</button>`;
  });
  html+=`</div></div>`;

  if(!saved){
    html+=`<div class="row" style="margin-top:10px"><button id="answerBtn" class="primary">Responder e corrigir</button></div>`;
  } else {
    html+=`<div class="feedback ${saved.correct?"ok":"bad"}"><b>${saved.correct?"Correta":"Incorreta"}.</b> ${q.comentario}</div>`;
    const nextPending=firstUnanswered(card);
    if(nextPending>=0){
      html+=`<button id="continueBtn" class="primary" style="width:100%;margin-top:10px">Ir para a próxima questão pendente</button>`;
    } else {
      html+=`<button id="continueBtn" class="primary" style="width:100%;margin-top:10px">Card concluído · avançar</button>`;
    }
  }

  if(card.questoes.length>1){
    html+=`<div class="row" style="margin-top:10px">`;
    for(let i=0;i<card.questoes.length;i++){
      const a=(state.answers[card.id]||{})[i];
      const label=a?(a.correct?"✓":"✕"):String(i+1);
      html+=`<button class="jumpQ ${i===currentQuestion?"ghost":""}" data-q="${i}" aria-label="Questão ${i+1}">${label}</button>`;
    }
    html+=`</div>`;
  }

  if(!isCardComplete(card)){
    const pending=card.questoes.length-answeredCount(card);
    html+=`<div class="pending">Faltam ${pending} questão(ões) para concluir este card.</div>`;
  }

  html+=`</div>`;
  document.getElementById("questionArea").innerHTML=html;

  document.querySelectorAll(".alt").forEach(b=>b.onclick=()=>{
    selected=Number(b.dataset.i);
    state.drafts[card.id]=state.drafts[card.id]||{};
    state.drafts[card.id][currentQuestion]=selected;
    save();
    document.querySelectorAll(".alt").forEach(x=>x.classList.remove("selected"));
    b.classList.add("selected");
  });

  document.querySelectorAll(".qConfidence").forEach(b=>b.onclick=()=>{
    state.qConfidence[card.id]=state.qConfidence[card.id]||{};
    state.qConfidence[card.id][currentQuestion]=b.dataset.c;
    save();
    document.querySelectorAll(".qConfidence").forEach(x=>x.classList.toggle("ghost",x===b));
  });

  document.querySelectorAll(".jumpQ").forEach(b=>b.onclick=()=>{
    currentQuestion=Number(b.dataset.q);
    renderQuestion();
    focusQuestion();
  });

  const answerBtn=document.getElementById("answerBtn");
  if(answerBtn) answerBtn.onclick=answer;

  const continueBtn=document.getElementById("continueBtn");
  if(continueBtn) continueBtn.onclick=()=>{
    const pending=firstUnanswered(card);
    if(pending>=0){
      currentQuestion=pending;
      renderQuestion();
      focusQuestion();
    } else {
      moveCard(1,true);
    }
  };
}

function answer(){
  const card=currentCard();
  const q=card.questoes[currentQuestion];
  const confidence=(state.qConfidence[card.id]||{})[currentQuestion];
  if(selected===null) return alert("Selecione uma alternativa.");
  if(!confidence) return alert("Informe sua segurança antes de corrigir.");

  state.answers[card.id]=state.answers[card.id]||{};
  state.answers[card.id][currentQuestion]={
    selected,
    correct:selected===q.gabarito,
    confidence,
    answeredAt:new Date().toISOString()
  };
  state.drafts[card.id]=state.drafts[card.id]||{};
  state.drafts[card.id][currentQuestion]=selected;

  if(selected!==q.gabarito || confidence==="baixa"){
    state.marked[card.id]=true;
  }

  if(isCardComplete(card)){
    state.completed[card.id]=true;
  } else {
    delete state.completed[card.id];
  }

  save();
  renderQuestion();
  updateStats();
  focusQuestion();
}

function updateStats(){
  const done=CARDS.filter(isCardComplete).length;
  let total=0,correct=0;
  Object.values(state.answers).forEach(obj=>Object.values(obj).forEach(a=>{
    total++;
    if(a.correct) correct++;
  }));
  document.getElementById("doneStat").textContent=done;
  document.getElementById("answeredStat").textContent=total;
  document.getElementById("accStat").textContent=total?Math.round(correct/total*100)+"%":"—";
  document.getElementById("progressText").textContent=`${done} de ${CARDS.length} cards concluídos`;
  document.getElementById("progressBar").style.width=(done/CARDS.length*100)+"%";
}

function focusCardTop(){
  if(document.activeElement && typeof document.activeElement.blur==="function") document.activeElement.blur();
  requestAnimationFrame(()=>document.getElementById("studyCard").scrollIntoView({behavior:"smooth",block:"start"}));
}

function focusQuestion(){
  if(document.activeElement && typeof document.activeElement.blur==="function") document.activeElement.blur();
  requestAnimationFrame(()=>document.getElementById("questionArea").scrollIntoView({behavior:"smooth",block:"start"}));
}

function moveCard(delta,force=false){
  const card=currentCard();
  if(delta>0 && !force && !isCardComplete(card)){
    currentQuestion=firstUnanswered(card);
    renderQuestion();
    focusQuestion();
    return alert("Conclua as questões pendentes antes de avançar para o próximo card.");
  }
  const seq=getSequence();
  state.current=(state.current+delta+seq.length)%seq.length;
  currentQuestion=0;
  save();
  render();
  focusCardTop();
}

document.getElementById("mode").onchange=e=>{
  state.mode=e.target.value;
  state.current=0;
  currentQuestion=0;
  save();
  render();
  focusCardTop();
};

document.getElementById("nextBtn").onclick=()=>moveCard(1);
document.getElementById("prevBtn").onclick=()=>moveCard(-1,true);

document.getElementById("note").oninput=e=>{
  state.notes[currentCard().id]=e.target.value;
  save();
};

document.getElementById("timerBtn").onclick=()=>{
  tickActiveTime();
  state.timerRunning=!state.timerRunning;
  state.lastTick=Date.now();
  save();
  updateTimeUI();
};

document.getElementById("exportBtn").onclick=()=>{
  tickActiveTime();
  save();
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="dataprev_cards_checkpoint_mvp03.json";
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();

document.getElementById("fileInput").onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      state=JSON.parse(r.result);
      state.answers=state.answers||{};
      state.drafts=state.drafts||{};
      state.qConfidence=state.qConfidence||{};
      state.confidence=state.confidence||{};
      state.notes=state.notes||{};
      state.completed=state.completed||{};
      state.marked=state.marked||{};
      state.activeMs=Number(state.activeMs)||0;
      state.timerRunning=state.timerRunning!==false;
      state.lastTick=Date.now();
      save();
      render();
      alert("Checkpoint importado.");
    }catch{
      alert("Arquivo inválido.");
    }
  };
  r.readAsText(f);
};

document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Apagar todo o progresso deste MVP?")){
    localStorage.removeItem(KEY);
    location.reload();
  }
};

function reportMetrics(){
  let total=0,correct=0,errors=0,low=0,medium=0,high=0;
  CARDS.forEach(card=>{
    const ans=state.answers[card.id]||{};
    Object.keys(ans).forEach(qi=>{
      const a=ans[qi];
      total++;
      if(a.correct) correct++; else errors++;
      const c=(state.qConfidence[card.id]||{})[qi]||a.confidence;
      if(c==="baixa") low++;
      if(c==="media") medium++;
      if(c==="alta") high++;
    });
  });
  const allQuestions=CARDS.reduce((s,c)=>s+c.questoes.length,0);
  return {
    total,correct,errors,low,medium,high,
    allQuestions,
    unanswered:allQuestions-total,
    completeCards:CARDS.filter(isCardComplete).length
  };
}

function makeReport(){
  tickActiveTime();
  save();
  const m=reportMetrics();
  const pct=m.total?((m.correct/m.total)*100).toFixed(1):"0.0";
  const lines=[
    "DATAPREV CARDS — RELATÓRIO",
    "",
    `Início registrado: ${state.startedAt}`,
    `Gerado: ${new Date().toISOString()}`,
    `Tempo ativo: ${formatDuration(state.activeMs)}`,
    "",
    "RESUMO",
    `Cards concluídos: ${m.completeCards}/${CARDS.length}`,
    `Questões respondidas: ${m.total}/${m.allQuestions}`,
    `Acertos: ${m.correct}/${m.total} (${pct}%)`,
    `Erros: ${m.errors}`,
    `Questões pendentes: ${m.unanswered}`,
    `Segurança: alta ${m.high} | média ${m.medium} | baixa ${m.low}`,
    ""
  ];

  const priority=[];

  CARDS.forEach(card=>{
    const ans=state.answers[card.id]||{};
    const hasActivity=Object.keys(ans).length||state.notes[card.id]||getCardQuestionConfidence(card.id).length;
    if(!hasActivity) return;

    lines.push(`CARD: ${card.id} — ${card.disciplina} — ${card.titulo}`);
    lines.push(`Status: ${isCardComplete(card)?"concluído":`incompleto (${answeredCount(card)}/${card.questoes.length})`}`);
    lines.push(`Explicação: ${card.explicacao}`);
    if(state.notes[card.id]) lines.push(`Nota: ${state.notes[card.id]}`);

    card.questoes.forEach((q,qi)=>{
      const a=ans[qi];
      const c=(state.qConfidence[card.id]||{})[qi]||(a&&a.confidence)||"não informada";
      lines.push(`Q${qi+1}. ${q.enunciado}`);
      q.alternativas.forEach((alt,i)=>lines.push(`${String.fromCharCode(65+i)}) ${alt}`));

      if(!a){
        lines.push("Resposta: pendente");
        lines.push(`Segurança: ${c}`);
      } else {
        lines.push(`Resposta marcada: ${String.fromCharCode(65+a.selected)}`);
        lines.push(`Gabarito: ${String.fromCharCode(65+q.gabarito)}`);
        lines.push(`Resultado: ${a.correct?"acerto":"erro"}`);
        lines.push(`Segurança: ${c}`);
        lines.push(`Comentário: ${q.comentario}`);

        if(!a.correct){
          priority.push(`${card.disciplina} — ${card.titulo} — Q${qi+1}: revisar em até 1 dia`);
        } else if(c==="baixa"){
          priority.push(`${card.disciplina} — ${card.titulo} — Q${qi+1}: revisar em até 1 dia`);
        } else if(c==="media"){
          priority.push(`${card.disciplina} — ${card.titulo} — Q${qi+1}: revisar em 2–3 dias`);
        }
      }
    });
    lines.push("");
  });

  lines.push("REVISÕES PRIORITÁRIAS");
  if(priority.length){
    [...new Set(priority)].forEach(p=>lines.push(`- ${p}`));
  } else {
    lines.push("- Nenhuma revisão prioritária identificada.");
  }

  return lines.join("\n");
}

document.getElementById("reportBtn").onclick=()=>{
  document.getElementById("reportText").value=makeReport();
  document.getElementById("reportPanel").classList.remove("hidden");
  document.getElementById("studyCard").classList.add("hidden");
};

document.getElementById("closeReport").onclick=()=>{
  document.getElementById("reportPanel").classList.add("hidden");
  document.getElementById("studyCard").classList.remove("hidden");
};

document.getElementById("copyReport").onclick=async()=>{
  const text=document.getElementById("reportText").value;
  try{
    await navigator.clipboard.writeText(text);
    alert("Relatório copiado.");
  }catch{
    document.getElementById("reportText").select();
    document.execCommand("copy");
    alert("Relatório copiado.");
  }
};

function updateViewportCover(){
  if(!window.visualViewport) return;
  const cover=Math.max(0,window.innerHeight-window.visualViewport.height-window.visualViewport.offsetTop);
  document.documentElement.style.setProperty("--viewport-cover",cover+"px");
}

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",updateViewportCover);
  window.visualViewport.addEventListener("scroll",updateViewportCover);
}

updateViewportCover();
save();
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("./service-worker.js");
      registration.update();

      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    } catch (error) {
      console.error("Falha ao registrar o modo offline:", error);
    }
  });
}
</script>
